volumes:
  vschome:
  apikeys:
  apikeys2:
  apikeys3:
    
services:
  opnsense-cli-dev:
    image: mcr.microsoft.com/devcontainers/go:2-1.25
    depends_on:
      - opnsense-dev
    command: sleep infinity
    ports:
      - "8080:8080"
    volumes:
      - ../:/workspace/opnsense-cli
      - vschome:/home/vscode
      - apikeys:/keys:rw
      - apikeys2:/keys2:rw
      - apikeys3:/keys3:rw

  opnsense-dev:
    image: ghcr.io/ddf89/docker-opnsense:26.7
    devices:
      - /dev/kvm
    # device_cgroup_rules:
    #   - 'c 10:232 rwm'
    cap_add:
      - NET_ADMIN
    stop_grace_period: 3m
    container_name: opnsense-dev
    volumes:
      - apikeys:/root/keys:rw
    ports:
      - "18180:80"
      - "10443:443"
      - "12122:22"
      - "15153:53"

  opnsense-dev2:
    image: ghcr.io/ddf89/docker-opnsense:26.7
    devices:
      - /dev/kvm
    # device_cgroup_rules:
    #   - 'c 10:232 rwm'
    cap_add:
      - NET_ADMIN
    stop_grace_period: 3m
    container_name: opnsense-dev2
    volumes:
      - apikeys2:/root/keys:rw
    ports:
      - "28180:80"
      - "20443:443"
      - "22122:22"
      - "25153:53"

  opnsense-dev3:
    image: ghcr.io/ddf89/docker-opnsense:26.7
    devices:
      - /dev/kvm
    # device_cgroup_rules:
    #   - 'c 10:232 rwm'
    cap_add:
      - NET_ADMIN
    stop_grace_period: 3m
    container_name: opnsense-dev3
    volumes:
      - apikeys3:/root/keys:rw
    ports:
      - "38180:80"
      - "30443:443"
      - "32122:22"
      - "35153:53"
